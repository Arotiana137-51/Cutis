# The Xcode project is generated from this file by XcodeGen on every CI build.
# Never edit a .xcodeproj by hand: it is not stored in the repository.
#
# "Cutis" is the internal code name (project, target, Swift module). The name
# users see, the bundle ID and the Team ID live in Config/App.xcconfig.
name: Cutis

options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# App identity (name, bundle ID, Team ID, version) for every build configuration.
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

# Pure-Swift packages. Their unit tests run on cheap Linux CI runners.
packages:
  AppCore:
    path: Packages/AppCore

targets:
  Cutis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: AppCore
        product: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
        MARKETING_VERSION: $(APP_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(APP_BUILD_NUMBER)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signing is done in CI with a certificate and profile managed by
        # fastlane match (see fastlane/Fastfile), so signing is "manual" here.
        CODE_SIGN_STYLE: Manual
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore $(APP_BUNDLE_ID)

schemes:
  Cutis:
    build:
      targets:
        Cutis: all
    run:
      config: Debug
    archive:
      config: Release
